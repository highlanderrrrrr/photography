<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lee's Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=25">
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
</head>
<body>

  <header class="site-header" id="site-header">
    <div class="header-brand">
      <a href="#" class="wordmark-link"><h1 class="wordmark">Lee</h1></a>
      <span class="brand-divider">/</span>
      <p class="tagline">Expedition, landscape, and candid documentary.</p>
    </div>

    <nav class="header-nav">
      <a href="#hero-section" class="nav-link">Featured</a>
      <a href="#albums-section" class="nav-link">Collections</a>
      <a href="#favorites-section" class="nav-link">Selected</a>
      <a href="https://www.youtube.com/@OverlandOutAndAbout" target="_blank" rel="noopener noreferrer" class="nav-link nav-link-ext">Channel &nearr;</a>
      <span class="nav-pipe">|</span>
      <p id="stats-line" class="stats-line" hidden></p>
    </nav>
  </header>

  <main>
    <div id="home-view">
      <!-- Asymmetric Editorial Split Hero -->
      <section id="hero-section" class="hero-section" hidden>
        <div class="hero-split-container">
          <div class="hero-frame" id="hero-frame">
            <img id="hero-image" src="" alt="Featured photograph" fetchpriority="high">
            <div class="hero-frame-badge">Featured</div>
          </div>

          <aside class="hero-sidebar">
            <div class="hero-sidebar-header">
              <span class="editorial-index">ARCHIVE // 01</span>
              <h2 class="editorial-title" id="hero-sidebar-title">Featured Work</h2>
            </div>

            <div class="editorial-metadata-panel">
              <div class="meta-row">
                <span class="meta-label">Camera</span>
                <span class="meta-value" id="hero-meta-camera">—</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Optics</span>
                <span class="meta-value" id="hero-meta-lens">—</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Exposure</span>
                <span class="meta-value" id="hero-meta-exposure">—</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">ISO</span>
                <span class="meta-value" id="hero-meta-iso">—</span>
              </div>
            </div>

            <p class="editorial-caption" id="hero-sidebar-caption"></p>

            <button class="hero-expand-btn" id="hero-expand-btn">
              <span>View Full Frame</span>
              <span class="btn-arrow">&rarr;</span>
            </button>
          </aside>
        </div>
      </section>

      <section id="albums-section">
        <h2 class="section-label">Collections</h2>
        <div id="albums-grid" class="album-carousel" aria-live="polite"></div>
      </section>

      <section id="favorites-section">
        <h2 class="section-label">Selected Photographs</h2>
        <div id="favorites-grid" class="photo-grid" aria-live="polite"></div>
      </section>
    </div>

    <div id="album-view" hidden>
      <div class="album-header">
        <a href="#" id="back-link" class="back-link">&larr; Back to collections</a>
        <h2 id="album-title" class="section-label album-title"></h2>
      </div>
      <div id="album-grid" class="photo-grid" aria-live="polite"></div>
    </div>

    <p id="empty-state" class="empty-state" hidden></p>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <img class="lb-image" id="lb-image" src="" alt="">
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
    <div class="lb-meta-box">
      <div class="lb-exif" id="lb-exif"></div>
      <p class="lb-caption" id="lb-caption"></p>
    </div>
  </div>

  <script src="script.js?v=26"></script>
</body>
</html>
